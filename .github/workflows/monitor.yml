name: Monitor OLX

on:
  schedule:
    - cron: "*/59 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-olx
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run build

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          WHATSAPP_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          WHATSAPP_API_KEY_AMIGO: ${{ secrets.WHATSAPP_API_KEY_AMIGO }}
          WHATSAPP_PHONE_AMIGO: ${{ secrets.WHATSAPP_PHONE_AMIGO }}
        run: npm run start

      - name: Save sent ads history
        run: |
          if git diff --quiet -- data/sent-ads.json; then
            echo "No sent ads changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/sent-ads.json
            git commit -m "chore: update sent ads history"
            git pull --rebase
            git push
          fi

