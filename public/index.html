<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BotMonitoramentoOLX Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Transições suaves */
    .fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <header class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between">
      <div>
        <h1 class="text-3xl font-bold text-gray-900">Dashboard de Monitoramento</h1>
        <p class="text-sm text-gray-500 mt-1">Anúncios recentes encontrados pelo BotMonitoramentoOLX</p>
      </div>
      <div class="mt-4 md:mt-0 text-sm text-gray-500">
        <span id="lastUpdated" class="font-medium bg-white px-3 py-1 rounded-full shadow-sm">Atualizando...</span>
      </div>
    </header>

    <!-- Indicadores -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8 fade-in">
      <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 border-l-4 border-l-blue-500">
        <h3 class="text-sm font-medium text-gray-500 mb-1">Total de Anúncios</h3>
        <p class="text-3xl font-bold text-gray-900" id="totalAds">-</p>
      </div>

      <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 border-l-4 border-l-red-500">
        <h3 class="text-sm font-medium text-gray-500 mb-1">Alta Oportunidade (🔥)</h3>
        <p class="text-3xl font-bold text-gray-900" id="highOportunities">-</p>
      </div>

      <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 border-l-4 border-l-yellow-500">
        <h3 class="text-sm font-medium text-gray-500 mb-1">Oportunidade Média (🟡)</h3>
        <p class="text-3xl font-bold text-gray-900" id="mediumOportunities">-</p>
      </div>

      <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 border-l-4 border-l-gray-400">
        <h3 class="text-sm font-medium text-gray-500 mb-1">Últimas 24 horas</h3>
        <p class="text-3xl font-bold text-gray-900" id="last24Ads">-</p>
      </div>
    </div>

    <!-- Cards de Anúncios -->
    <div class="mb-6 flex justify-between items-center fade-in" style="animation-delay: 0.1s;">
      <h2 class="text-xl font-semibold text-gray-800">Últimos Anúncios (100 mais recentes)</h2>
    </div>

    <div id="adsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 fade-in" style="animation-delay: 0.2s;">
      <div class="col-span-full py-8 text-center text-gray-500 bg-white rounded-xl border border-gray-100">
        Carregando dados...
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        // Tenta carregar o JSON (no github pages o arquivo estará em ./data/sent-ads.json)
        const response = await fetch('./data/sent-ads.json');
        if (!response.ok) {
          throw new Error('Falha ao carregar os dados');
        }

        const data = await response.json();

        // Atualiza a data
        document.getElementById('lastUpdated').textContent = 'Última atualização: ' + new Date().toLocaleString('pt-BR');

        // Ordena por mais recente primeiro
        const sortedData = data.sort((a, b) => new Date(b.sentAt) - new Date(a.sentAt));

        // Indicadores
        document.getElementById('totalAds').textContent = sortedData.length;

        const high = sortedData.filter(ad => ad.level === 'alta').length;
        document.getElementById('highOportunities').textContent = high;

        const medium = sortedData.filter(ad => ad.level === 'media').length;
        document.getElementById('mediumOportunities').textContent = medium;

        const now = new Date();
        const yesterday = new Date(now.getTime() - (24 * 60 * 60 * 1000));
        const last24h = sortedData.filter(ad => new Date(ad.sentAt) >= yesterday).length;
        document.getElementById('last24Ads').textContent = last24h;

        // Renderiza cards (pega apenas os 100 mais recentes)
        const container = document.getElementById('adsContainer');
        container.innerHTML = ''; // Limpa loading

        const recentAds = sortedData.slice(0, 100);

        if (recentAds.length === 0) {
          container.innerHTML = '<div class="col-span-full py-8 text-center text-gray-500 bg-white rounded-xl border border-gray-100">Nenhum anúncio encontrado.</div>';
          return;
        }

        recentAds.forEach(ad => {
          const card = document.createElement('div');
          card.className = 'bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition-shadow flex flex-col';

          // Formata data
          const dateStr = new Date(ad.sentAt).toLocaleString('pt-BR', {
            day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
          });

          // Badge pro score/level
          let badgeColor = 'bg-gray-100 text-gray-800 border-gray-200';
          let levelIcon = '⚪';
          if (ad.level === 'alta') {
            badgeColor = 'bg-red-50 text-red-700 border-red-200';
            levelIcon = '🔥';
          } else if (ad.level === 'media') {
            badgeColor = 'bg-yellow-50 text-yellow-700 border-yellow-200';
            levelIcon = '🟡';
          }

          const scoreBadge = ad.score !== undefined
            ? `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${badgeColor}">
                ${levelIcon} Score: ${ad.score}
               </span>`
            : '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border text-gray-400 bg-gray-50 border-gray-200">Sem Score</span>';

          let priceHistoryHtml = '';
          if (ad.history && ad.history.length > 0) {
             const oldest = ad.history[0];
             const oldDate = new Date(oldest.date).toLocaleDateString('pt-BR');
             priceHistoryHtml = `
               <div class="mt-3 bg-red-50 border border-red-100 p-3 rounded-lg text-sm">
                 <div class="text-red-700 font-bold mb-1 flex items-center">
                   <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"></path></svg>
                   Redução de Preço!
                 </div>
                 <div class="flex justify-between items-center">
                   <div class="text-gray-500 line-through">${oldest.priceTexto} <span class="text-xs">(${oldDate})</span></div>
                   <div class="text-green-600 font-bold text-lg">${ad.priceTexto || '-'}</div>
                 </div>
               </div>
             `;
          }

          card.innerHTML = `
            <div class="p-5 flex-grow">
              <div class="flex justify-between items-start mb-2">
                <div class="text-xs text-gray-400">${dateStr}</div>
                ${scoreBadge}
              </div>
              <h3 class="text-gray-900 font-semibold text-base line-clamp-2 mb-2" title="${ad.title || ad.url}">
                ${ad.title || 'Título não disponível'}
              </h3>
              ${priceHistoryHtml === '' ? `<div class="text-2xl font-bold text-gray-800 mt-2">${ad.priceTexto || '-'}</div>` : priceHistoryHtml}
            </div>
            <div class="border-t border-gray-100 p-4 bg-gray-50 mt-auto">
              <a href="${ad.url}" target="_blank" rel="noopener noreferrer" class="w-full inline-flex justify-center items-center text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 transition-colors">
                Ver anúncio na OLX
                <svg class="ml-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
              </a>
            </div>
          `;
          container.appendChild(card);
        });

      } catch (error) {
        console.error('Erro ao carregar dashboard', error);
        document.getElementById('adsContainer').innerHTML = `
          <div class="col-span-full py-8 text-center text-red-500 bg-red-50 rounded-xl border border-red-100">
            Erro ao carregar dados. Verifique se o arquivo data/sent-ads.json existe e está acessível.
          </div>`;
      }
    });
  </script>
</body>
</html>
